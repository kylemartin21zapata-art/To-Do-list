<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <title>To-Do List App</title>
  </head>
  <body>
    <main class="container">
      <aside class="leftbar">
        <div class="menu-part">
          <img src="images/kmlogo.jfif" alt="KM Logo" class="km-logo" />

          <h3>Menu</h3>
        </div>
        <div class="search-bar">
          <span class="magny-glass">🔍︎</span>
          <input
            type="search"
            placeholder="Search"
            name="Search bar"
            class="search-bar"
          />
        </div>

        <div class="filters">
          <input type="radio" id="active" name="filter" checked />
          <label for="active">Active</label>

          <input type="radio" id="show-completed" name="filter" />
          <label for="show-completed">Show Completed</label>
        </div>
      </aside>

      <section class="task-control">
        <h1>To-Do List</h1>

        <div class="todo-bar">
          <button type="add-task">
            ✚<span class="name-list">Add List</span>
          </button>
        </div>

        <section class="task-lists">
          <ul>
            <li>
              <input type="checkbox" /><input
                type="text"
                value="Learn HTML"
              /><button type="delete">Delete</button>
            </li>

            <li>
              <input type="checkbox" /><input
                type="text"
                value="Learn CSS"
              /><button type="delete">Delete</button>
            </li>

            <li>
              <input type="checkbox" /><input
                type="text"
                value="Learn JavaScript"
              /><button type="delete">Delete</button>
            </li>
          </ul>
        </section>
      </section>

      <section class="completed">
        <ul></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
